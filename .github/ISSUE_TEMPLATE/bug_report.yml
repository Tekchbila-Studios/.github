# No `labels:` key on purpose. A default template can only apply a label that
# exists in BOTH this repo and the repo the issue is opened in; a missing label
# makes the template fail to load rather than degrade gracefully.
name: Bug report
description: Something behaves differently than documented or intended
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerability? Stop — do not file it here.
        See [SECURITY.md](https://github.com/Tekchbila-Studios/.github/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        Ran `...` against a plan with three aliased providers.
        Expected the diagram to render. Got an empty diagram and no error.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: >
        The smallest sequence that triggers it. A ten-line Terraform config that
        fails is worth more than three paragraphs describing a large one.
      placeholder: |
        1. terraform plan -out=tfplan
        2. ...
        3. Diagram is empty
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: >
        Exact text, not a paraphrase — one character of difference can be the
        whole bug. Redact anything sensitive; say where you redacted.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA of the project this is about.
      placeholder: v1.4.2, or 9f2c1ab
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: >
        OS, and — if a Terraform plan is involved — your Terraform and provider
        versions. These decide the answer more often than anything else here.
      placeholder: macOS 15.3, Terraform 1.10.5, hashicorp/aws 5.87.0

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability
          required: true
